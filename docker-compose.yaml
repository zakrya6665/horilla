services:
  horilla:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${HORILLA_SECRET_KEY}
      DATABASE_URL: 'postgres://horilla_app:${HORILLA_DB_PASSWORD}@supabase-db:5432/postgres'
      HORILLA_DB_PASSWORD: ${HORILLA_DB_PASSWORD}  # ← Expose to container
      DEBUG: 'false'
      ALLOWED_HOSTS: akcwsc44w0w88co4oswww4og.hexabizsolutions.cloud
      CSRF_TRUSTED_ORIGINS: 'https://akcwsc44w0w88co4oswww4og.hexabizsolutions.cloud'
    command: >
      sh -c "
        /opt/venv/bin/python -c \"
          import os, psycopg2;
          psycopg2.connect(
            host='supabase-db',
            port=5432,
            dbname='postgres',
            user='horilla_app',
            password=os.environ['HORILLA_DB_PASSWORD']
          )
        \" &&
        echo '✅ DB connected!' &&
        /opt/venv/bin/python manage.py migrate --noinput &&
        /opt/venv/bin/python manage.py collectstatic --noinput &&
        exec /opt/venv/bin/gunicorn horilla.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - ./custom-ui:/app/static/images/ui
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 180s
    networks:
      - supabase-net

networks:
  supabase-net:
    external: true
    name: supabase-net
