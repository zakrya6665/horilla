services:
  horilla:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: '${HORILLA_SECRET_KEY}'
      DATABASE_URL: 'postgres://horilla_app:${HORILLA_DB_PASSWORD}@supabase-db:5432/postgres'
      HORILLA_DB_PASSWORD: '${HORILLA_DB_PASSWORD}'
      DEBUG: 'false'
      ALLOWED_HOSTS: akcwsc44w0w88co4oswww4og.hexabizsolutions.cloud
      CSRF_TRUSTED_ORIGINS: 'https://akcwsc44w0w88co4oswww4og.hexabizsolutions.cloud'
    volumes:
      - './custom-ui:/app/static/images/ui'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8000/health'
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 60s
    networks:
      - supabase-net

networks:
  supabase-net:
    external: true
    name: supabase-net
