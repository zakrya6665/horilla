version: '3.8'

services:
  web:
    image: python:3.12-slim
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt gunicorn psycopg2-binary &&
        python manage.py collectstatic --noinput &&
        gunicorn horilla.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${HORILLA_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DATABASE_URL=postgres://horilla_app:${HORILLA_DB_PASSWORD}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./app:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app:/app:ro
      - staticfiles:/static:ro
      - media:/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  staticfiles:
  media:
